name: Station CSV Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "resource/station-dev.csv"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  station-csv-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # PR 只需讀取權限，且 fork 的 PR 拿不到 secrets
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.PAT_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          sparse-checkout: |
            resource/station-dev.csv
            resource/station.csv
            scripts/station-check.ts
          sparse-checkout-cone-mode: false

      # 此 job 為必要檢查，所有 PR 都會觸發；未修改 resource/station-dev.csv 時直接通過
      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --no-renames --name-only HEAD^1 HEAD | grep -qx "resource/station-dev.csv"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "未修改 resource/station-dev.csv，略過檢查"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.changes.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run station check
        if: steps.changes.outputs.changed == 'true'
        run: bun run scripts/station-check.ts

      - name: Commit and push changes
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 設置 remote URL 包含 PAT token
          git remote set-url origin https://x-access-token:$PAT_TOKEN@github.com/${{ github.repository }}.git

          git add resource/station.csv
          git diff --staged --quiet || git commit -m "chore: update station.csv from station-dev.csv [skip ci]"
          git push origin main
